<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowForge Watch</title>
<!-- Fallback UI for the FlowForge API (S10). Single file, no build step, no external requests.
     Serve it from the API at /ui, or open this file directly (then start the API with CORS_ORIGINS=null). -->
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface-1: #fcfcfb; --surface-2: #ffffff; --line: #d9d8d3; --grid: #e7e6e1;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #6d6c67;
  --accent: #2a78d6; --accent-ink: #ffffff; --focus: #2a78d6;
  --series-1: #2a78d6; --series-2: #eb6834;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --chip: #eceae4; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface-1: #1a1a19; --surface-2: #222220; --line: #3a3935; --grid: #2c2b28;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #9a998f;
    --accent: #3987e5; --focus: #3987e5; --series-1: #3987e5; --series-2: #d95926; --chip: #2c2b28;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface-1: #1a1a19; --surface-2: #222220; --line: #3a3935; --grid: #2c2b28;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #9a998f;
  --accent: #3987e5; --focus: #3987e5; --series-1: #3987e5; --series-2: #d95926; --chip: #2c2b28;
  --shadow: none;
}
* { box-sizing: border-box; }
html { font-size: 17px; }
body { margin: 0; background: var(--bg); color: var(--text-primary);
       font: 1rem/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--surface-2); border-bottom: 1px solid var(--line);
             display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; }
.brand { font-weight: 700; font-size: 1.15rem; letter-spacing: .01em; }
.brand small { font-weight: 400; color: var(--text-secondary); margin-left: 6px; font-size: .8rem; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs a { text-decoration: none; color: var(--text-secondary); padding: 6px 12px; border-radius: 8px; font-weight: 600; }
nav.tabs a[aria-current="page"] { background: var(--chip); color: var(--text-primary); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface-1); padding: 7px 14px; border-radius: 8px; cursor: pointer;
       font-weight: 600; }
.btn:hover { border-color: var(--text-muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--critical); color: var(--critical); }
.btn.shock { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.conn { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--text-secondary); }
.conn input { width: 13rem; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-1); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); display: inline-block; }
.dot.ok { background: var(--good); } .dot.bad { background: var(--critical); }

main { max-width: 1280px; margin: 0 auto; padding: 16px; }
.disclaimer { font-size: .85rem; color: var(--text-secondary); margin: 0 0 12px; }
h1 { font-size: 1.5rem; margin: 4px 0 4px; } h2 { font-size: 1.15rem; margin: 0 0 10px; }
.sub { color: var(--text-secondary); margin: 0 0 14px; }
.card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.stack > * + * { margin-top: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--text-muted); } .secondary { color: var(--text-secondary); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
.kv dt { color: var(--text-secondary); } .kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.big { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); font-weight: 700; }
td.num, th.num { text-align: right; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--chip); }

.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .85rem; white-space: nowrap; }
.badge .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.b-RED .sw, .b-FAIL .sw, .b-critical .sw { background: var(--critical); }
.b-AMBER .sw, .b-WARN .sw { background: var(--warning); }
.b-GREEN .sw, .b-PASS .sw { background: var(--good); }
.b-none .sw { background: var(--line); }
.tag { font-size: .72rem; font-weight: 700; letter-spacing: .05em; border: 1.5px solid var(--text-muted); color: var(--text-secondary);
       border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.tag.REAL { border-color: var(--good); } .tag.PROXY { border-style: dashed; } .tag.SYNTH { border-style: dotted; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .82rem; font-weight: 600; white-space: nowrap; }

.banner { border-left: 4px solid var(--accent); background: var(--surface-1); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
.banner.err { border-color: var(--critical); } .banner.ok { border-color: var(--good); }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent);
           border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

/* chart */
.viz { position: relative; }
.viz svg { width: 100%; height: auto; display: block; }
.viz .axis text { fill: var(--text-muted); font-size: 12px; }
.viz .gridline { stroke: var(--grid); stroke-width: 1; }
.viz .hair { stroke: var(--text-muted); stroke-width: 1; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: .88rem; color: var(--text-secondary); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 22px; height: 0; border-top: 3px solid; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
       padding: 8px 10px; font-size: .85rem; box-shadow: var(--shadow); min-width: 190px; display: none; }
.tip .t { color: var(--text-secondary); font-weight: 600; margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; } .tip .r b { font-variant-numeric: tabular-nums; }

.checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.checklist input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
textarea, .field { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
pre.json { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto;
           font: 13px/1.4 ui-monospace, Consolas, monospace; max-height: 340px; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 3rem 5.5rem 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.timeline .agent { font-weight: 700; }
code { font: 13px ui-monospace, Consolas, monospace; }
.list-item { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface-2); }
.list-item[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.gate-grid { display: grid; gap: 16px; grid-template-columns: minmax(220px, 300px) 1fr; align-items: start; }
.queue { max-height: calc(100vh - 190px); overflow-y: auto; padding: 2px 4px 2px 2px; position: sticky; top: 120px; }
.conn { flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 720px) { html { font-size: 16px; } .gate-grid { grid-template-columns: 1fr; }
  .queue { position: static; max-height: 40vh; } .conn { width: 100%; } .conn input { flex: 1 1 7rem; width: auto; min-width: 0; }
  header.top .brand small { display: none; } .conn input { width: 9rem; } .timeline li { grid-template-columns: 2.5rem 4rem 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">FlowForge <small>price-controlled medicine early warning</small></div>
  <nav class="tabs" aria-label="Pages">
    <a href="#/watchlist" data-page="watchlist">Watchlist</a>
    <a href="#/molecule" data-page="molecule">Molecule</a>
    <a href="#/approval" data-page="approval">Approval</a>
    <a href="#/audit" data-page="audit">Audit</a>
    <a href="#/recall" data-page="recall">Recall</a>
  </nav>
  <span class="spacer"></span>
  <button class="btn shock" id="shockBtn" title="What-if: API import cost +30%">Shock +30%</button>
  <div class="conn">
    <span class="dot" id="connDot" aria-hidden="true"></span>
    <label class="sr" for="apiBase">API URL</label><input id="apiBase" placeholder="API URL">
    <label class="sr" for="apiKey">API key</label><input id="apiKey" type="password" placeholder="X-API-Key">
    <button class="btn" id="saveConn">Connect</button>
    <button class="btn" id="themeBtn" title="Switch light/dark">◐</button>
  </div>
</header>
<main id="app" tabindex="-1"></main>

<script>
"use strict";
/* ------------------------------------------------------------ storage + api */
const store = {
  get(k, d) { try { const v = localStorage.getItem("ff." + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ff." + k, v); } catch { /* private mode: keep in memory only */ } },
};
const state = { base: "", key: "", lastRun: store.get("lastRun", ""), shock: null };
const DEFAULT_BASE = location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8000";

async function api(path, opts = {}) {
  const res = await fetch(state.base.replace(/\/$/, "") + path, {
    method: opts.method || "GET",
    headers: { "X-API-Key": state.key, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch {}
    throw new Error(`${res.status}: ${detail}`);
  }
  return opts.raw ? res.text() : res.json();
}

/* ------------------------------------------------------------ DOM helpers (textContent only) */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false)
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const $app = document.getElementById("app");
function render(...nodes) { $app.replaceChildren(...nodes); }
function banner(msg, kind = "") { return h("div", { class: `banner ${kind}`, role: kind === "err" ? "alert" : "status" }, msg); }
function loading(msg = "Loading…") { return h("p", { class: "secondary" }, h("span", { class: "spinner" }), " ", msg); }

const fmt = {
  num: (v, d = 1) => v === null || v === undefined || Number.isNaN(v) ? "–" : Number(v).toLocaleString("en-IN", { maximumFractionDigits: d, minimumFractionDigits: d }),
  inr: (v, d = 2) => v === null || v === undefined ? "–" : "₹" + Number(v).toLocaleString("en-IN", { maximumFractionDigits: d, minimumFractionDigits: d }),
  pct: (v, d = 1) => v === null || v === undefined || Number.isNaN(v) ? "–" : (v * 100).toFixed(d) + "%",
  months: (lo, hi) => lo === null || lo === undefined ? "–" : `${fmt.num(lo, 0)}–${fmt.num(hi, 0)} mo`,
  ts: (v) => v ? String(v).replace("T", " ").slice(0, 19) : "–",
  hash: (v) => v ? String(v).slice(0, 10) : "–",
};
const CAUSE = {
  CEILING_BELOW_COST: "Ceiling below est. cost", HEADROOM_ERODING: "Headroom eroding", SINGLE_ORIGIN_API: "Single-origin API",
  FEW_PRODUCERS: "Few producers", QUALITY_NSQ: "Quality alerts (NSQ)", SUPPLIER_OTD_DROP: "Supplier delivery drop",
};
const BAND_ICON = { RED: "▲", AMBER: "◆", GREEN: "●", PASS: "✓", WARN: "!", FAIL: "✕" };
const BAND_WORD = { RED: "High", AMBER: "Elevated", GREEN: "Low" };  // exit-risk wording only
function band(b, words = true) {
  if (!b) return h("span", { class: "badge b-none" }, h("span", { class: "sw" }), "not assessed");
  const label = words && BAND_WORD[b] ? `${BAND_WORD[b]} (${b})` : b;
  return h("span", { class: `badge b-${b}` }, h("span", { class: "sw", "aria-hidden": "true" }), `${BAND_ICON[b] || ""} ${label}`);
}
function tag(t) { return t ? h("span", { class: `tag ${t}`, title: "data provenance" }, t) : null; }
function cause(c) { return c ? h("span", { class: "chip" }, CAUSE[c] || c) : h("span", { class: "muted" }, "–"); }
const DISCLAIMER = "Every flag is a risk flag for review from deterministic rules. It is not a statement about any manufacturer's intent. Producer counts are lower bounds.";

/* ------------------------------------------------------------ routing */
const pages = { watchlist, molecule, approval, audit, recall };
function route() {
  const [, page = "watchlist", arg = ""] = location.hash.split("/");
  const name = pages[page] ? page : "watchlist";
  document.querySelectorAll("nav.tabs a").forEach(a =>
    a.dataset.page === name ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if (!state.key) return render(connectHelp());
  pages[name](decodeURIComponent(arg)).catch(e => render(banner("Could not load: " + e.message, "err")));
}
window.addEventListener("hashchange", route);
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

function connectHelp() {
  return h("div", { class: "card stack" }, h("h1", {}, "Connect to the FlowForge API"),
    h("p", {}, "Enter the API URL and the API key (APP_API_KEY) in the top bar, then press Connect. The key stays in this browser only."),
    h("p", { class: "secondary" }, "Local: uvicorn api.main:app --port 8000, then open http://127.0.0.1:8000/ui."));
}

/* ------------------------------------------------------------ Watchlist */
async function watchlist() {
  render(loading());
  const assessed = store.get("assessedOnly", "1") === "1";
  const rows = await api(`/watchlist?limit=200&assessed_only=${assessed}`);
  const toggle = h("label", { class: "row" }, h("input", { type: "checkbox", checked: assessed || null,
    onchange: e => { store.set("assessedOnly", e.target.checked ? "1" : "0"); watchlist(); } }), "Assessed formulations only");
  const body = rows.map(r => h("tr", { class: "click", tabindex: "0", onclick: () => go(`#/molecule/${encodeURIComponent(r.form_id)}`),
      onkeydown: e => { if (e.key === "Enter") go(`#/molecule/${encodeURIComponent(r.form_id)}`); } },
    h("td", {}, h("div", { style: "font-weight:700" }, r.generic || r.form_id),
      h("div", { class: "secondary", style: "font-size:.85rem" }, [r.strength, r.dosage_form].filter(Boolean).join(" · "))),
    h("td", {}, band(r.exit_risk_band)),
    h("td", { class: "num" }, fmt.num(r.exposure, 2)),
    h("td", {}, cause(r.cause_code)),
    h("td", { class: "num" }, fmt.months(r.window_months_lo, r.window_months_hi)),
    h("td", { class: "num" }, fmt.pct(r.headroom_pct)),
    h("td", {}, r.producers_label),
    h("td", { class: "num" }, fmt.num(r.min_days_of_cover, 0)),
    h("td", { class: "num" }, r.confidence === null ? "–" : fmt.pct(r.confidence, 0)),
    h("td", {}, tag(r.data_tag))));
  render(h("div", { class: "stack" },
    h("div", { class: "row" }, h("div", {}, h("h1", {}, "Watchlist"),
      h("p", { class: "sub" }, "Sorted by exposure: exit risk × criticality × gap in hospital cover.")), h("span", { class: "spacer" }), toggle),
    h("p", { class: "disclaimer" }, DISCLAIMER),
    rows.length ? h("div", { class: "card table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, ["Formulation", "Exit-risk flag", "Exposure", "Cause", "Window", "Headroom", "Producers", "Days cover", "Confidence", "Data"]
        .map((t, i) => h("th", { class: [2, 4, 5, 7, 8].includes(i) ? "num" : null, scope: "col" }, t)))),
      h("tbody", {}, body)))
      : banner(assessed ? "No assessed formulations yet. Press “Shock +30%” and run the agents, or untick “Assessed only”." : "No formulations.")));
}

/* ------------------------------------------------------------ Molecule detail */
async function molecule(id) {
  if (!id) {
    render(h("div", { class: "card" }, h("h1", {}, "Molecule detail"), h("p", {}, "Pick a formulation on the Watchlist.")));
    return;
  }
  render(loading());
  const d = await api(`/molecule/${encodeURIComponent(id)}`);
  const f = d.formulation, s = d.signal, dep = d.dependency, fc = d.forecast;
  const chartBox = h("div", {}, loading("Replaying the Margin Sentinel month by month…"));
  const title = h("div", {}, h("h1", {}, `${f.GENERIC || id} ${f.STRENGTH || ""}`),
    h("p", { class: "sub" }, [f.DOSAGE_FORM, f.NLEM_LEVEL && `NLEM ${f.NLEM_LEVEL}`, `ceiling ${fmt.inr(f.CEILING_PRICE)} excl. GST`,
      f.CEILING_SO_NUMBER].filter(Boolean).join(" · ")));
  const tags = h("div", { class: "row" }, h("span", { class: "secondary" }, "Data:"),
    Object.entries(d.data_tags).map(([k, v]) => h("span", { class: "row", style: "gap:4px" }, h("span", { class: "muted" }, k), tag(v))));

  const margin = h("div", { class: "card" }, h("h2", {}, "Margin (A1)"), s ? h("div", { class: "stack" },
    h("div", { class: "row" }, band(s.band, false), h("span", { class: "secondary" }, s.band === "GREEN" ? "headroom above threshold" : "headroom below threshold")), h("dl", { class: "kv" },
      h("dt", {}, "Headroom"), h("dd", {}, fmt.pct(s.headroom_pct)),
      h("dt", {}, "Trend"), h("dd", {}, `${fmt.num(s.headroom_trend * 100, 2)} pts / month`),
      h("dt", {}, "Months to breach"), h("dd", {}, s.months_to_breach === null ? "–" : fmt.num(s.months_to_breach, 1)),
      h("dt", {}, "Est. realisation"), h("dd", {}, fmt.inr(s.realisation_inr)),
      h("dt", {}, "Est. unit cost"), h("dd", {}, fmt.inr(s.unit_cost_inr)),
      h("dt", {}, "Confidence"), h("dd", {}, fmt.pct(s.data_quality.confidence, 0))))
    : h("p", { class: "muted" }, "Not assessed yet."));

  const dependency = h("div", { class: "card" }, h("h2", {}, "Dependency (A2)"), dep ? h("dl", { class: "kv" },
      h("dt", {}, "Producers"), h("dd", {}, dep.n_producers_min ? `at least ${dep.n_producers_min}` : "none on record"),
      h("dt", {}, "Concentration (HHI)"), h("dd", {}, fmt.num(dep.hhi, 2)),
      h("dt", {}, "Top API origin"), h("dd", {}, dep.top_origin_country ? `${dep.top_origin_country} · ${fmt.pct(dep.top_origin_share, 0)} of imports` : "–"),
      h("dt", {}, "Affected materials"), h("dd", {}, dep.affected_materials.join(", ") || "–"),
      h("dt", {}, "Affected wards"), h("dd", {}, dep.affected_wards.join(", ") || "–"))
    : h("p", { class: "muted" }, "Not assessed yet."), graphSummary(d.graph));

  const forecast = h("div", { class: "card" }, h("h2", {}, "Forecast (A3)"), fc ? h("div", { class: "stack" },
    h("div", { class: "row" }, band(fc.exit_risk_band), cause(fc.cause_code)),
    h("dl", { class: "kv" },
      h("dt", {}, "Exit-risk window"), h("dd", {}, fmt.months(fc.window_months_lo, fc.window_months_hi)),
      h("dt", {}, "Hospital cover"), h("dd", {}, fc.days_of_cover === null ? "–" : `${fmt.num(fc.days_of_cover, 0)} days`),
      h("dt", {}, "Stock-out if exit"), h("dd", {}, fc.stockout_date_if_exit || "–"),
      h("dt", {}, "Exposure"), h("dd", {}, fmt.num(fc.exposure, 2))),
    h("p", { class: "secondary", style: "font-size:.85rem;margin:0" }, "Probability-based flag for review; the window is when an exit becomes more likely, not a prediction that it will happen."))
    : h("p", { class: "muted" }, "Not assessed yet."));

  const scen = h("div", { class: "card" }, h("h2", {}, "Scenarios (A4) and checks (A5)"), d.scenarios.length ? h("div", { class: "table-wrap" }, h("table", {},
    h("thead", {}, h("tr", {}, ["Rank", "Option", "Supplier", "Qty", "Cost", "Coverage", "Expiry waste", "Correlated risk", "A5 verdict", ""].map(t => h("th", { scope: "col" }, t)))),
    h("tbody", {}, [...d.scenarios].sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999)).map(sc => {
      const rec = d.recommendations.find(r => r.recommendation.scenario_id === sc.scenario_id);
      return h("tr", {},
        h("td", {}, sc.rank ?? h("span", { class: "muted" }, "rejected")),

/* ------------------------------------------------------------ chart: one y-axis (INR), two series + shocked cost */
function marginChart(ms) {
  const pts = ms.points;
  const series = [
    { key: "realisation_inr", label: "Est. manufacturer realisation under the NPPA ceiling", short: "Realisation", color: "var(--series-1)", dash: "" },
    { key: "unit_cost_inr", label: "Est. unit cost", short: "Unit cost", color: "var(--series-2)", dash: "" },
  ];
  if (ms.shock) series.push({ key: "shocked_unit_cost_inr", label: `Est. unit cost if API import cost ×${ms.shock}`, short: `Cost ×${ms.shock}`, color: "var(--series-2)", dash: "6 5" });
  const vals = pts.flatMap(p => series.map(s => p[s.key])).filter(v => v !== null);
  if (!vals.length) return banner("No ceiling-vs-cost history for this formulation (no ceiling or cost data in the window).");
  const W = 880, H = 300, m = { l: 64, r: 150, t: 12, b: 34 };
  const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.15 || hi * 0.1 || 1;
  const y0 = Math.max(0, lo - pad), y1 = hi + pad;
  const x = i => m.l + (pts.length === 1 ? 0 : i * (W - m.l - m.r) / (pts.length - 1));
  const y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs, ...kids) => { const el = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); kids.forEach(k => el.append(k)); return el; };
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Ceiling versus estimated cost for ${ms.form_id}, last ${pts.length} months` });
  const ticks = 4;
  const axis = s("g", { class: "axis" });
  for (let i = 0; i <= ticks; i++) {
    const v = y0 + (y1 - y0) * i / ticks;
    axis.append(s("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: y(v), y2: y(v) }));
    const t = s("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }); t.textContent = "₹" + v.toFixed(v < 10 ? 2 : 1); axis.append(t);
  }
  pts.forEach((p, i) => { if (i % 2 === 0 || i === pts.length - 1) { const t = s("text", { x: x(i), y: H - 10, "text-anchor": "middle" }); t.textContent = p.month; axis.append(t); } });
  svg.append(axis);
  for (const se of series) {
    let d = "", pen = false;
    pts.forEach((p, i) => { const v = p[se.key]; if (v === null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    svg.append(s("path", { d, fill: "none", stroke: se.color, "stroke-width": 2.5, "stroke-dasharray": se.dash, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const lastI = pts.map(p => p[se.key]).findLastIndex(v => v !== null);
    if (lastI >= 0) {
      const v = pts[lastI][se.key];
      svg.append(s("circle", { cx: x(lastI), cy: y(v), r: 4.5, fill: se.color, stroke: "var(--surface-1)", "stroke-width": 2 }));
      const lab = s("text", { x: x(lastI) + 10, y: y(v) + 4, fill: "var(--text-primary)", "font-size": 13, "font-weight": 600 });
      lab.textContent = `${se.short} ₹${v.toFixed(2)}`; svg.append(lab);
    }
  }
  const hair = s("line", { class: "hair", y1: m.t, y2: H - m.b, visibility: "hidden" }); svg.append(hair);
  const hit = s("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent", tabindex: 0 }); svg.append(hit);

  const tip = h("div", { class: "tip", role: "status" });
  const wrap = h("div", { class: "viz" }, svg, tip);
  function show(i) {
    const p = pts[i]; hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.setAttribute("visibility", "visible");
    tip.replaceChildren(h("div", { class: "t" }, `${p.month} · margin flag ${p.band}`),
      ...series.map(se => h("div", { class: "r" }, h("span", {}, h("span", { style: `display:inline-block;width:14px;border-top:3px ${se.dash ? "dashed" : "solid"} ${se.color};margin-right:6px;vertical-align:middle` }), se.short),
        h("b", {}, p[se.key] === null ? "–" : fmt.inr(p[se.key])))),
      h("div", { class: "r" }, h("span", {}, "Headroom"), h("b", {}, fmt.pct(p.headroom_pct))));
    const rect = svg.getBoundingClientRect(), px = x(i) / W * rect.width;
    tip.style.display = "block";
    tip.style.left = Math.min(px + 14, rect.width - tip.offsetWidth - 4) + "px"; tip.style.top = "8px";
  }
  function idxAt(clientX) { const r = svg.getBoundingClientRect(); const vx = (clientX - r.left) / r.width * W;
    return Math.max(0, Math.min(pts.length - 1, Math.round((vx - m.l) / ((W - m.l - m.r) / Math.max(1, pts.length - 1))))); }
  let cur = pts.length - 1;
  hit.addEventListener("pointermove", e => show(cur = idxAt(e.clientX)));
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); });
  hit.addEventListener("focus", () => show(cur));
  hit.addEventListener("blur", () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); });
  hit.addEventListener("keydown", e => { if (e.key === "ArrowLeft") show(cur = Math.max(0, cur - 1)); if (e.key === "ArrowRight") show(cur = Math.min(pts.length - 1, cur + 1)); });

  const legend = h("div", { class: "legend" }, series.map(se => h("span", {}, h("i", { style: `border-top-color:${se.color};border-top-style:${se.dash ? "dashed" : "solid"}` }), se.label)));
  const table = h("details", {}, h("summary", {}, "Table view"), h("div", { class: "table-wrap" }, h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, "Month"), series.map(se => h("th", { class: "num" }, se.short)), h("th", { class: "num" }, "Headroom"), h("th", {}, "Flag"))),
    h("tbody", {}, pts.map(p => h("tr", {}, h("td", {}, p.month), series.map(se => h("td", { class: "num" }, fmt.inr(p[se.key]))),
      h("td", { class: "num" }, fmt.pct(p.headroom_pct)), h("td", {}, p.band)))))));
  return h("div", {}, legend, wrap,
    h("p", { class: "secondary", style: "font-size:.85rem" }, `${ms.note} Months without a ceiling or cost record are left blank. Data: `,
      Object.entries(ms.data_tags).map(([k, v]) => h("span", { style: "margin-right:6px" }, `${k} `, tag(v)))), table);
}

function gatePanel(p) {

  const out = h("div", {});
  const allTicked = () => boxes.every(b => b.checked);

  const editBtn = h("button", { class: "btn", disabled: true }, "Edit & approve");
  boxes.forEach(b => b.addEventListener("change", () => { approveBtn.disabled = editBtn.disabled = !allTicked(); }));

  async function send(decision, extra = {}) {
    const u = user.value.trim();
    if (!u) { out.replaceChildren(banner("Enter your user id first.", "err")); user.focus(); return; }
    store.set("user", u);
    const checklist = Object.fromEntries(boxes.map(b => [b.dataset.k, b.checked]));
    out.replaceChildren(loading("Recording the decision…"));
    try {
      const r = await api("/approval", { method: "POST", body: { rec_id: p.rec_id, decision, user: u, checklist, level: p.awaiting_level, ...extra } });
      state.lastRun = p.run_id; store.set("lastRun", p.run_id);

        banner(`Decision recorded: ${r.status.replaceAll("_", " ").toLowerCase()}${r.banfn ? ` · purchase requisition ${r.banfn} created (S/4-shaped, FF_MM_EBAN mock)` : ""}`, "ok"),
        ...(r.notes || []).map(n => h("p", { class: "secondary" }, n)),

        r.payload ? h("details", { open: true }, h("summary", {}, "API_PURCHASEREQ_PROCESS_SRV payload"), h("pre", { class: "json" }, JSON.stringify(r.payload, null, 2))) : null,
        h("div", { class: "row" }, h("button", { class: "btn", onclick: () => go(`#/audit/${encodeURIComponent(p.run_id)}`) }, "Open audit trail"),
          h("button", { class: "btn", onclick: () => go("#/approval") }, "Back to queue"))));
    } catch (e) { out.replaceChildren(banner(e.message, "err")); }
  }
  approveBtn.addEventListener("click", () => send("APPROVE"));
  editBtn.addEventListener("click", () => {
    const edits = {}; if (qty.value) edits.qty = Number(qty.value); if (supplier.value.trim()) edits.supplier = supplier.value.trim();
    if (!Object.keys(edits).length) { out.replaceChildren(banner("Enter a new quantity or supplier to edit.", "err")); return; }
    send("EDIT_APPROVE", { edits });
  });
  const rejectBtn = h("button", { class: "btn danger", onclick: () => {
    if (!reason.value.trim()) { out.replaceChildren(banner("A reason is required to reject.", "err")); reason.focus(); return; }
    send("REJECT", { reason: reason.value.trim() }); } }, "Reject");
  const snoozeBtn = h("button", { class: "btn", onclick: () => send("SNOOZE", { snooze_days: Number(snooze.value) || 7 }) }, "Snooze");

  return h("div", { class: "stack" },
    h("div", { class: "card" }, h("div", { class: "row" }, h("h2", { style: "margin:0" }, `${p.generic || p.form_id}`),
        band(p.overall === "READY" ? "PASS" : "WARN", false), h("span", { class: "secondary" }, p.overall.replace("_", " ").toLowerCase()),
        p.needs_second_approver ? h("span", { class: "chip" }, "second approver required") : null),
      h("dl", { class: "kv", style: "margin-top:10px" },
        h("dt", {}, "Option"), h("dd", {}, (sc.option_type || "").replace("_", " ").toLowerCase()),
        h("dt", {}, "Material / plant"), h("dd", {}, pr ? `${pr.Material} · ${pr.Plant}` : "–"),
        h("dt", {}, "Quantity"), h("dd", {}, pr ? `${fmt.num(pr.RequestedQuantity, 0)} ${pr.BaseUnit}` : fmt.num(sc.qty, 0)),
        h("dt", {}, "Supplier"), h("dd", {}, pr?.FixedSupplier || sc.supplier || "–"),
        h("dt", {}, "Unit rate (incl. GST)"), h("dd", {}, fmt.inr(pr?.PurchaseRequisitionPrice ?? sc.unit_rate_inr)),
        h("dt", {}, "Value"), h("dd", {}, fmt.inr(sc.cost, 0)),

        h("dt", {}, "Coverage"), h("dd", {}, `${fmt.num(sc.coverage_days, 0)} days`))),
    h("div", { class: "card table-wrap" }, h("h2", {}, "A5 checks"), h("table", {},
      h("thead", {}, h("tr", {}, ["Result", "Check", "Rule", "Source"].map(t => h("th", {}, t)))),
      h("tbody", {}, p.checks.map(c => h("tr", {}, h("td", {}, band(c.status, false)), h("td", {}, c.name),

    h("div", { class: "card stack" }, h("h2", {}, "Manual verification (tick every item to approve)"),

      h("label", {}, "Approver", user),

    h("div", { class: "card" }, h("h2", {}, `${r.matches.length} matching stock location(s)`), r.matches.length ? h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, ["Plant", "Store", "Material", "Batch", "Unrestricted", "Quality insp.", "Blocked", "Expiry", "Match"].map(t => h("th", {}, t)))),
      h("tbody", {}, r.matches.map(m => h("tr", {}, h("td", {}, m.PLANT_NAME || m.WERKS), h("td", {}, m.LGORT), h("td", {}, m.MATNR), h("td", {}, m.CHARG),
        h("td", { class: "num" }, fmt.num(m.CLABS, 0)), h("td", { class: "num" }, fmt.num(m.CINSM, 0)), h("td", { class: "num" }, fmt.num(m.CSPEM, 0)),
        h("td", {}, String(m.VFDAT).slice(0, 10)), h("td", {}, h("span", { class: "chip" }, m.MATCH_LEVEL)))))))
      : h("p", { class: "muted" }, "No matching batch in hospital stock.")),
    h("p", { class: "secondary" }, r.note)));
}

/* ------------------------------------------------------------ Shock +30% */
async function shock() {
  const btn = document.getElementById("shockBtn");
  btn.disabled = true;
  render(h("div", { class: "stack" }, h("h1", {}, "Shock: API import cost +30%"), loading("What-if on the Margin Sentinel for all tracked formulations…")));
  try {
    const r = await api("/scenario/shock", { method: "POST", body: { multiplier: 1.3 } });
    const changed = r.rows.filter(x => x.band_changed);
    const toRed = changed.filter(x => x.shocked.band === "RED").map(x => x.form_id);
    const runIds = (toRed.length ? toRed : changed.map(x => x.form_id)).slice(0, 10);
    const status = h("div", {});
    const runBtn = h("button", { class: "btn primary", disabled: !runIds.length || null, onclick: async () => {
      runBtn.disabled = true; status.replaceChildren(loading(`Running A1 → A5 on ${runIds.length} formulation(s) with the shock applied…`));
      try {
        const run = await api("/run", { method: "POST", body: { form_ids: runIds, shock: 1.3 } });
        state.lastRun = run.run_id; store.set("lastRun", run.run_id); store.set("assessedOnly", "1");
        status.replaceChildren(banner(`Run ${run.run_id}: ${run.awaiting_approval.length} recommendation(s) waiting at the human gate. Audit chain ${run.chain_ok ? "intact" : "BROKEN"}.`, run.chain_ok ? "ok" : "err"),
          h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => go("#/watchlist") }, "Open watchlist"),
            h("button", { class: "btn", onclick: () => go("#/approval") }, "Open approval queue")));
      } catch (e) { status.replaceChildren(banner(e.message, "err")); runBtn.disabled = false; }
    } }, `Run the agents on ${runIds.length} flagged formulation(s)`);
    render(h("div", { class: "stack" }, h("h1", {}, "Shock: API import cost +30%"),
      h("p", { class: "sub" }, `${changed.length} of ${r.rows.length} tracked formulations change margin flag; ${toRed.length} move to RED. ${r.note}`),
      h("div", { class: "card table-wrap" }, h("table", {},
        h("thead", {}, h("tr", {}, ["Formulation", "Margin flag before", "Margin flag after", "Headroom before", "Headroom after"].map((t, i) => h("th", { class: i > 2 ? "num" : null }, t)))),
        h("tbody", {}, r.rows.slice(0, 15).map(x => h("tr", { class: "click", onclick: () => go(`#/molecule/${encodeURIComponent(x.form_id)}`) },
          h("td", {}, h("div", { style: "font-weight:700" }, x.generic || x.form_id), h("div", { class: "secondary", style: "font-size:.85rem" }, x.strength || "")),
          h("td", {}, band(x.baseline.band, false)), h("td", {}, band(x.shocked.band, false)),
          h("td", { class: "num" }, fmt.pct(x.baseline.headroom_pct)), h("td", { class: "num" }, fmt.pct(x.shocked.headroom_pct))))))),
      r.rows.length > 15 ? h("p", { class: "muted" }, `Showing 15 of ${r.rows.length}.`) : null,
      h("div", { class: "row" }, runBtn), status));
  } catch (e) { render(banner("Shock failed: " + e.message, "err")); }
  finally { btn.disabled = false; }
}

/* ------------------------------------------------------------ boot */
async function connect() {
  state.base = document.getElementById("apiBase").value.trim() || DEFAULT_BASE;
  state.key = document.getElementById("apiKey").value;
  store.set("base", state.base); store.set("key", state.key);
  const dot = document.getElementById("connDot");
  try { await api("/health"); dot.className = "dot ok"; dot.title = "API reachable"; }
  catch (e) { dot.className = "dot bad"; dot.title = "API unreachable: " + e.message; }
  route();
}
document.getElementById("apiBase").value = store.get("base", DEFAULT_BASE);
document.getElementById("apiKey").value = store.get("key", "");
document.getElementById("saveConn").addEventListener("click", connect);
document.getElementById("apiKey").addEventListener("keydown", e => { if (e.key === "Enter") connect(); });
document.getElementById("shockBtn").addEventListener("click", shock);
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("theme", document.documentElement.dataset.theme);
});
const savedTheme = store.get("theme", ""); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
if (!location.hash) location.hash = "#/watchlist";
connect();
</script>
</body>
