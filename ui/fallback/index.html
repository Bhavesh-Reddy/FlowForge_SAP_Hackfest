<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowForge · Medicine shortage early warning</title>
<link rel="icon" href="data:,">
<!--
  FlowForge fallback UI (S10, redesigned in S13): SAP Fiori look with SAP UI5 Web Components (Horizon theme),
  bundled locally in assets/ui5.js so it also works offline. Same REST API as SAP Build Apps; every data call
  sends the X-API-Key header. All text is set with textContent (no innerHTML from data).
-->
<style>
  :root { --ff-gap: 1rem; }
  html, body { margin: 0; background: var(--sapBackgroundColor, #f5f6f7); color: var(--sapTextColor, #1d2d3e);
    font-family: var(--sapFontFamily, "72", "72full", Arial, Helvetica, sans-serif); font-size: 0.875rem; }
  body:not(.ready) main, body:not(.ready) nav { visibility: hidden; }
  #boot { padding: 2rem; font-size: 1rem; }
  main { max-width: 1320px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
  .muted { color: var(--sapContent_LabelColor, #556b82); }
  .small { font-size: 0.8125rem; }
  .row { display: flex; gap: var(--ff-gap); flex-wrap: wrap; align-items: center; }
  .spread { justify-content: space-between; }
  .grid { display: grid; gap: var(--ff-gap); }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); align-items: stretch; }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .stack > * + * { margin-top: var(--ff-gap); }
  .pad { padding: 0.75rem 1rem 1rem; }
  ui5-card { width: 100%; }
  h1.page { font-size: 1.5rem; font-weight: 700; margin: 0.25rem 0 0.25rem; }
  .lead { font-size: 0.95rem; margin: 0 0 0.75rem; max-width: 72rem; }
  /* guided flow */
  nav.steps { background: var(--sapObjectHeader_Background, #fff); border-bottom: 1px solid var(--sapGroup_TitleBorderColor, #d9d9d9); }
  nav.steps ol { list-style: none; display: flex; margin: 0 auto; padding: 0 1.25rem; max-width: 1320px; gap: 0.25rem; overflow-x: auto; }
  nav.steps li { flex: 1 1 0; min-width: 150px; }
  nav.steps button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 0.6rem; align-items: center;
    width: 100%; padding: 0.7rem 0.5rem; border-bottom: 3px solid transparent; }
  nav.steps button:focus-visible { outline: 2px solid var(--sapContent_FocusColor, #0070f2); outline-offset: -2px; }
  nav.steps .num { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
    border: 1px solid var(--sapButton_BorderColor, #bcc3ca); color: var(--sapContent_LabelColor, #556b82); flex: none; }
  nav.steps .t1 { font-weight: 700; display: block; }
  nav.steps .t2 { font-size: 0.75rem; color: var(--sapContent_LabelColor, #556b82); display: block; }
  nav.steps button[aria-current="step"] { border-bottom-color: var(--sapBrandColor, #0070f2); }
  nav.steps button[aria-current="step"] .num { background: var(--sapBrandColor, #0070f2); color: #fff; border-color: transparent; }
  /* KPI tiles */
  .kpi { padding: 0.9rem 1rem; }
  .kpi .v { font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .kpi .l { font-weight: 700; margin-top: 0.15rem; }
  .kpi .d { font-size: 0.75rem; color: var(--sapContent_LabelColor, #556b82); margin-top: 0.2rem; }
  .v.neg { color: var(--sapNegativeColor, #aa0808); } .v.crit { color: var(--sapCriticalColor, #e76500); }
  .v.pos { color: var(--sapPositiveColor, #256f3a); }
  /* facts */
  dl.facts { display: grid; grid-template-columns: minmax(150px, 40%) 1fr; gap: 0.45rem 1rem; margin: 0; max-width: 760px; }
  .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0.25rem 1rem; align-items: start; }
  dl.facts dt { color: var(--sapContent_LabelColor, #556b82); }
  dl.facts dd { margin: 0; font-weight: 600; }
  .answer { font-size: 1rem; font-weight: 700; margin: 0.1rem 0 0.6rem; }
  .why { background: var(--sapInformationBackgroundColor, #e1f4ff); border-radius: 0.5rem; padding: 0.75rem 1rem; }
  .clickable { cursor: pointer; }
  .loc { padding: 0.9rem 1rem; }
  .loc .big { font-size: 1.4rem; font-weight: 700; }
  .legend { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; font-size: 0.8125rem; }
  .legend span.sw { display: inline-block; width: 1.4rem; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 0.3rem; }
  svg text { font-family: inherit; fill: var(--sapContent_LabelColor, #556b82); font-size: 11px; }
  pre.json { background: var(--sapShell_Background, #f2f2f2); padding: 0.75rem; border-radius: 0.5rem; overflow: auto; max-height: 18rem;
    font-size: 0.75rem; margin: 0; }
  .split { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: var(--ff-gap); align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } .g2 { grid-template-columns: 1fr; } }
  .qlist { max-height: 70vh; overflow: auto; }
  .hint { font-size: 0.8125rem; color: var(--sapContent_LabelColor, #556b82); }
  .sr { position: absolute; left: -9999px; }
  ui5-table { --ff: 0; }
</style>
</head>
<body>
<div id="boot">Loading FlowForge…</div>

<ui5-shellbar id="shell" primary-title="FlowForge" secondary-title="Medicine shortage early warning · Demo Hospital">
  <ui5-shellbar-item id="connItem" icon="disconnected" text="Connection"></ui5-shellbar-item>
  <ui5-shellbar-item id="helpItem" icon="question-mark" text="How to read FlowForge"></ui5-shellbar-item>
</ui5-shellbar>

<nav class="steps" aria-label="Guided flow"><ol id="steps"></ol></nav>
<main id="app" tabindex="-1"></main>

<!-- connection dialog -->
<ui5-dialog id="connDlg" header-text="Connect to the FlowForge API">
  <div class="stack pad" style="min-width: min(520px, 80vw)">
    <p class="small muted" style="margin:0">The API runs on SAP BTP (or on this laptop). The key is the <b>app API key</b> the team set up; it is stored only in this browser.</p>
    <div><ui5-label for="apiBase" show-colon>API URL</ui5-label><ui5-input id="apiBase" style="width:100%"></ui5-input></div>
    <div><ui5-label for="apiKey" show-colon>API key</ui5-label><ui5-input id="apiKey" type="Password" style="width:100%"></ui5-input></div>
    <div id="connMsg"></div>
  </div>
  <div slot="footer" class="row" style="justify-content:flex-end; width:100%; padding: 0.5rem">
    <ui5-button id="connGo" design="Emphasized">Connect</ui5-button>
    <ui5-button id="connClose" design="Transparent">Close</ui5-button>
  </div>
</ui5-dialog>

<!-- help dialog -->
<ui5-dialog id="helpDlg" header-text="How to read FlowForge">
  <div class="pad stack" style="max-width: 760px" id="helpBody"></div>
  <div slot="footer" class="row" style="justify-content:flex-end; width:100%; padding: 0.5rem">
    <ui5-button id="helpClose" design="Emphasized">Got it</ui5-button>
  </div>
</ui5-dialog>

<!-- small "what does this mean?" popover -->
<ui5-popover id="tip" placement="Bottom"><div class="pad small" id="tipBody" style="max-width: 340px"></div></ui5-popover>
<!-- generic input dialog (edit / reject / snooze) -->
<ui5-dialog id="askDlg"><div class="pad stack" id="askBody" style="min-width: min(460px, 80vw)"></div>
  <div slot="footer" class="row" style="justify-content:flex-end; width:100%; padding: 0.5rem">
    <ui5-button id="askOk" design="Emphasized">OK</ui5-button><ui5-button id="askCancel" design="Transparent">Cancel</ui5-button>
  </div>
</ui5-dialog>
<ui5-toast id="toast" placement="BottomCenter" duration="4000"></ui5-toast>

<script type="module">
"use strict";
// Load the bundled SAP UI5 Web Components: from the API (/ui/assets) or next to this file when opened from disk.
const ASSETS = location.protocol === "file:" ? "assets/" : "/ui/assets/";
try { await import(ASSETS + "ui5.js"); }
catch (e) { document.getElementById("boot").textContent = "Could not load the SAP UI5 components (" + e.message + ")."; throw e; }
document.getElementById("boot").remove();
document.body.classList.add("ready");

/* ============================================================ plain-language dictionary */
const BAND = {
  RED: { text: "Act now", design: "Negative", icon: "error" },
  AMBER: { text: "Watch closely", design: "Critical", icon: "alert" },
  GREEN: { text: "Stable", design: "Positive", icon: "sys-enter-2" },
};
const CAUSE = {
  CEILING_BELOW_COST: ["Costs more to make than the price cap allows", "The estimated cost of making one unit is above what the maker earns under the NPPA price cap. Makers lose money on every unit."],
  HEADROOM_ERODING: ["Cost is climbing towards the price cap", "The margin between the maker's earnings under the cap and the cost of making it is shrinking month by month."],
  SINGLE_ORIGIN_API: ["Key ingredient mostly from one country", "Most of the active ingredient (API) is imported from a single country, so one disruption there hits every maker."],
  FEW_PRODUCERS: ["Few makers on record", "We found few (or no) companies making it. This count is a minimum: it comes from public quality records, so the real number can be higher."],
  QUALITY_NSQ: ["Recent quality failures (CDSCO)", "Batches of this medicine failed government quality tests recently (CDSCO 'Not of Standard Quality' alerts)."],
  SUPPLIER_OTD_DROP: ["Our supplier's deliveries are slipping", "On-time delivery from the hospital's supplier dropped in recent months."],
};
const OPTION = {
  BUFFER: ["Buy extra stock from the current supplier", "cart"],
  ALT_SUPPLIER: ["Buy from another maker", "supplier"],
  THERAPEUTIC_ALT: ["Switch to an alternative medicine (needs clinical sign-off)", "stethoscope"],
  REBALANCE: ["Move stock between our pharmacy locations", "shipping-status"],
};
const OVERALL = {
  READY: ["Ready for approval", "Positive"], NEEDS_CHANGES: ["Review the warnings", "Critical"], BLOCKED: ["Blocked by the rules", "Negative"],
};
const CHECK = {
  PRICE_COMPLIANCE: "Price is within the government cap plus GST (DPCO para 14)",
  SCHEDULED_STATUS: "Medicine is on the price-control list and its order is on record",
  SUPPLIER_LICENCE: "Supplier has a valid drug licence and GST number and is not blocked",
  QUALITY_HISTORY: "No recent quality failures for this supplier / maker",
  SHELF_LIFE: "Enough shelf life left on delivery",
  EXPIRY_WASTE: "Little or nothing will expire before it is used",
  BUDGET: "Fits the department budget (large orders need a second approver)",
  STORAGE: "Fits storage and cold-chain capacity",
  ROL_ROQ: "Resulting stock stays within the reorder limits",
  CLINICAL: "Clinical sign-off for a substitute medicine",
};
const CHECKLIST = [
  ["cp01_material_master", "The material matches: generic name, strength and pack (CP-01)"],
  ["cp02_rol_roq_stock", "Reorder level, quantity and the resulting stock are acceptable (CP-02)"],
  ["cp04_supplier_verified", "The supplier is verified: licence and past performance (CP-04)"],
  ["price_within_ceiling_gst", "The price is at or below the NPPA ceiling plus GST"],
  ["shelf_life_fefo_ok", "Shelf life and first-expiry-first-out use are acceptable"],
  ["cause_reviewed_not_claim", "I read the cause: it is a risk flag, not a claim about any manufacturer"],
];
const TAG = {
  REAL: ["REAL", "Positive", "Public data from the government or CDSCO"],
  PROXY: ["PROXY", "Information", "An estimate derived from public data"],
  SYNTH: ["SYNTH", "Neutral", "Synthetic demo data (hospital stock, API cost)"],
};
const AGENT = {
  A1: ["Margin check", "Is it still worth making under the price cap?", "money-bills"],
  A2: ["Supply map", "Who makes it and where does the ingredient come from?", "factory"],
  A3: ["Shortage forecast", "When could supply fail and how long does our stock last?", "trend-down"],
  A4: ["Options", "What can the hospital do about it?", "lightbulb"],
  A5: ["Rule checks", "Does each option follow DPCO and our SOP?", "shield"],
  GATE: ["Human decision", "The Chief Pharmacist's decision and checklist", "customer"],
  A6: ["Purchase requisition", "The approved order in SAP S/4HANA format (mock posting)", "document"],
};
const LOCATION = { CENT: "Central Pharmacy", ABLK: "A Block", BBLK: "B Block", CBLK: "C Block", ONCO: "Oncology" };
const NLEM = { P: "primary", S: "secondary", T: "tertiary" };
const STEPS = [
  ["watch", "Watch", "Which medicines are at risk"],
  ["understand", "Understand", "Why this medicine"],
  ["decide", "Decide", "Pharmacist approves an action"],
  ["prove", "Prove", "Tamper-evident audit trail"],
  ["recall", "Recall", "Find a failed batch"],
];

/* ============================================================ storage, api, dom */
const store = {
  get(k, d) { try { const v = localStorage.getItem("ff." + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ff." + k, v); } catch { /* private mode */ } },
};
const DEFAULT_BASE = location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8000";
const state = { base: store.get("base", DEFAULT_BASE), key: store.get("key", ""), step: "watch", form: store.get("form", ""),
  rec: "", run: store.get("lastRun", ""), watch: null, pending: null, shock: null };

async function api(path, opts = {}) {
  const res = await fetch(state.base.replace(/\/$/, "") + path, {
    method: opts.method || "GET",
    headers: { "X-API-Key": state.key, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch {}
    const err = new Error(`${res.status}: ${detail}`); err.status = res.status; throw err;
  }
  return opts.raw ? res.text() : res.json();
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k.startsWith(".")) el[k.slice(1)] = v;
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false)
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const $app = document.getElementById("app");
const toast = msg => { const t = document.getElementById("toast"); t.textContent = msg; t.open = true; };
function busy(msg) { return h("div", { class: "row pad" }, h("ui5-busy-indicator", { active: true, size: "M" }), h("span", { class: "muted" }, msg)); }
function strip(design, ...text) { return h("ui5-message-strip", { design, "hide-close-button": true }, ...text); }
function card(title, subtitle, icon, ...body) {
  const header = h("ui5-card-header", { slot: "header", "title-text": title, "subtitle-text": subtitle || "" },
    icon ? h("ui5-icon", { slot: "avatar", name: icon }) : null);
  return h("ui5-card", {}, header, h("div", { class: "pad" }, ...body));
}
function tag(text, design, icon) { return h("ui5-tag", { design: design || "Neutral" }, icon ? h("ui5-icon", { slot: "icon", name: icon }) : null, text); }
function bandTag(band, prefix = "") { const b = BAND[band]; return b ? tag(prefix + b.text, b.design, b.icon) : tag("Not assessed", "Neutral"); }
function dataTag(t) { const d = TAG[t] || [t || "?", "Neutral", ""]; const el = tag(d[0], d[1]); el.title = d[2]; return el; }
function info(text) {
  const b = h("ui5-button", { icon: "hint", design: "Transparent", tooltip: "What does this mean?", "accessible-name": "What does this mean?" });
  b.addEventListener("click", () => { const p = document.getElementById("tip"); document.getElementById("tipBody").textContent = text; p.opener = b; p.open = true; });
  return b;
}
function facts(pairs) { return h("dl", { class: "facts" }, ...pairs.filter(Boolean).flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])); }

const fmt = {
  n: (v, d = 0) => v === null || v === undefined || Number.isNaN(Number(v)) ? "–" : Number(v).toLocaleString("en-IN", { maximumFractionDigits: d, minimumFractionDigits: d }),
  inr: (v, d = 2) => v === null || v === undefined || v === "" ? "–" : "₹" + Number(v).toLocaleString("en-IN", { maximumFractionDigits: d, minimumFractionDigits: d }),
  pct: (v, d = 0) => v === null || v === undefined ? "–" : (Number(v) * 100).toLocaleString("en-IN", { maximumFractionDigits: d }) + "%",
  date: v => { if (!v) return "–"; const d = new Date(String(v).replace(" ", "T")); return isNaN(d) ? String(v) : d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }); },
  ts: v => { if (!v) return "–"; const d = new Date(String(v).replace(" ", "T") + (String(v).includes("Z") ? "" : "Z")); return isNaN(d) ? String(v) : d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); },
  med: r => [r.generic || r.GENERIC, r.strength || r.STRENGTH, (r.dosage_form || r.DOSAGE_FORM || "").toLowerCase()].filter(Boolean).join(" "),
  hash: v => v ? String(v).slice(0, 10) + "…" : "–",
};
const nlemText = lv => lv ? "Essential medicine (NLEM 2022) for " + lv.split(",").map(x => NLEM[x.trim()] || x).join(", ") + " care" : "Not on NLEM 2022";

/* ============================================================ shell: steps, connection, help */
function renderSteps() {
  const ol = document.getElementById("steps");
  ol.replaceChildren(...STEPS.map(([id, t1, t2], i) => h("li", {}, h("button", {
    "aria-current": state.step === id ? "step" : null, onclick: () => go(id) },
    h("span", { class: "num" }, String(i + 1)), h("span", {}, h("span", { class: "t1" }, t1), h("span", { class: "t2" }, t2))))));
}
async function go(step, arg) {
  state.step = step; renderSteps(); window.scrollTo(0, 0);
  if (step === "understand" && arg) { state.form = arg; store.set("form", arg); }
  if (step === "decide" && arg) state.rec = arg;
  if (step === "prove" && arg) { state.run = arg; store.set("lastRun", arg); }
  if (!state.key) { $app.replaceChildren(strip("Information", "Connect to the API first (top right).")); openConn(); return; }
  try { await ({ watch, understand, decide, prove, recall })[step](arg); }
  catch (e) { $app.replaceChildren(strip("Negative", "Could not load this page: " + e.message)); if (e.status === 401) openConn(); }
}

const connDlg = document.getElementById("connDlg");
function openConn() {
  document.getElementById("apiBase").value = state.base; document.getElementById("apiKey").value = state.key;
  document.getElementById("connMsg").replaceChildren(); connDlg.open = true;
}
async function connect() {
  state.base = document.getElementById("apiBase").value.trim() || DEFAULT_BASE;
  state.key = document.getElementById("apiKey").value.trim();
  const msg = document.getElementById("connMsg");
  msg.replaceChildren(busy("Checking the connection…"));
  try {
    const hl = await api("/health");
    await api("/watchlist?limit=1");
    store.set("base", state.base); store.set("key", state.key);
    setConn(true, hl.db_backend);
    msg.replaceChildren(strip("Positive", `Connected. Data comes from ${hl.db_backend === "hana" ? "SAP HANA Cloud" : "the local SQLite copy"}.`));
    setTimeout(() => { connDlg.open = false; go(state.step); }, 600);
  } catch (e) { setConn(false); msg.replaceChildren(strip("Negative", "Not connected: " + e.message)); }
}
function setConn(ok, backend) {
  const it = document.getElementById("connItem");
  it.icon = ok ? "connected" : "disconnected";
  it.text = ok ? `Connected · ${backend === "hana" ? "SAP HANA Cloud" : "SQLite"}` : "Connection";
  document.getElementById("shell").setAttribute("secondary-title",
    "Medicine shortage early warning · Demo Hospital" + (ok ? (backend === "hana" ? " · SAP BTP + SAP HANA Cloud" : " · offline copy") : ""));
}
document.getElementById("connItem").addEventListener("click", openConn);
document.getElementById("connGo").addEventListener("click", connect);
document.getElementById("connClose").addEventListener("click", () => { connDlg.open = false; });
document.getElementById("helpItem").addEventListener("click", () => { document.getElementById("helpDlg").open = true; });
document.getElementById("helpClose").addEventListener("click", () => { document.getElementById("helpDlg").open = false; });
document.getElementById("helpBody").append(
  h("p", { style: "margin-top:0" }, "The government (NPPA) caps the price of essential medicines. If the imported ingredient gets expensive, making the medicine stops paying and makers quietly stop. The hospital only notices when the shelf is empty. FlowForge spots that squeeze early and helps the pharmacist act before it happens."),
  h("ui5-title", { level: "H5" }, "The five steps"),
  h("ol", {}, ...STEPS.map(([, a, b]) => h("li", {}, h("b", {}, a + ": "), b))),
  h("ui5-title", { level: "H5" }, "Risk colours"),
  h("div", { class: "row" }, bandTag("RED"), "cost has met the cap, or supply could fail soon", bandTag("AMBER"), "worth watching", bandTag("GREEN"), "no concern now"),
  h("ui5-title", { level: "H5" }, "Where each number comes from"),
  h("div", { class: "stack" }, ...Object.keys(TAG).map(k => h("div", { class: "row" }, dataTag(k), TAG[k][2]))),
  strip("Information", "Every result is a probabilistic risk flag for review, computed by transparent rules. It is never a statement about what any manufacturer intends to do."),
);

/* ============================================================ 1. WATCH */
async function watch() {
  $app.replaceChildren(busy("Loading the watchlist from the database…"));
  const rows = await api("/watchlist?limit=200&assessed_only=true");
  state.watch = rows;
  if (rows[0] && rows[0].run_id) { state.run = state.run || rows[0].run_id; }
  const n = b => rows.filter(r => r.exit_risk_band === b).length;
  const lowCover = rows.filter(r => r.min_days_of_cover !== null && r.min_days_of_cover < 30).length;
  let filter = "ALL", query = "";

  const table = h("ui5-table", { "overflow-mode": "Popin", "accessible-name": "Watchlist" });
  const header = h("ui5-table-header-row", { slot: "headerRow", sticky: true },
    ...["Medicine", "Risk", "Main reason", "Our stock lasts", "Price cap (excl. GST)", "Makers on record", "Data"].map((t, i) =>
      h("ui5-table-header-cell", { "min-width": i === 0 ? "220px" : i === 2 ? "220px" : "110px" }, t)));
  function fill() {
    const q = query.toLowerCase();
    const shown = rows.filter(r => (filter === "ALL" || r.exit_risk_band === filter) && (!q || fmt.med(r).toLowerCase().includes(q)));
    table.replaceChildren(header, ...shown.map(r => {
      const c = CAUSE[r.cause_code];
      const tr = h("ui5-table-row", { interactive: true, "row-key": r.form_id },
        h("ui5-table-cell", {}, h("div", {}, h("b", {}, fmt.med(r)), h("div", { class: "small muted" }, r.therapeutic_class || ""))),
        h("ui5-table-cell", {}, bandTag(r.exit_risk_band)),
        h("ui5-table-cell", {}, c ? c[0] : "–"),
        h("ui5-table-cell", {}, r.min_days_of_cover === null ? "not stocked" : `${fmt.n(r.min_days_of_cover)} days`),
        h("ui5-table-cell", {}, fmt.inr(r.ceiling_price_inr) + " / unit"),
        h("ui5-table-cell", {}, r.producers_label || "–"),
        h("ui5-table-cell", {}, dataTag(r.data_tag)));

  user.addEventListener("input", update);
  const approve = h("ui5-button", { design: "Emphasized", icon: "accept", disabled: true }, p.awaiting_level === 2 ? "Approve (level 2)" : "Approve");
  const edit = h("ui5-button", { icon: "edit", disabled: true }, "Edit & approve");
  const reject = h("ui5-button", { design: "Negative", icon: "decline" }, "Reject");
  const snooze = h("ui5-button", { design: "Transparent", icon: "history" }, "Snooze");
  const result = h("div", {});
  function update() { const ok = Object.values(ticks).every(c => c.checked) && user.value.trim(); approve.disabled = !ok; edit.disabled = !ok; }
  const checklist = () => Object.fromEntries(Object.entries(ticks).map(([k, c]) => [k, c.checked]));
  async function send(decision, extra = {}) {
    for (const b of [approve, edit, reject, snooze]) b.disabled = true;
    result.replaceChildren(busy("Recording the decision…"));
    try {
      store.set("user", user.value.trim());
      const r = await api("/approval", { method: "POST", body: { rec_id: p.rec_id, decision, user: user.value.trim(), checklist: checklist(), level: p.awaiting_level, ...extra } });
      state.pending = null; state.run = p.run_id; store.set("lastRun", p.run_id);
      result.replaceChildren(outcome(r, p));
    } catch (e) { result.replaceChildren(strip("Negative", "Not recorded: " + e.message)); update(); reject.disabled = false; snooze.disabled = false; }
  }
  approve.addEventListener("click", () => send("APPROVE"));
  edit.addEventListener("click", () => ask("Edit the order, then approve", [["qty", "New quantity", String(sc.qty || "")], ["supplier", "New supplier (optional)", sc.supplier || ""]],
    v => send("EDIT_APPROVE", { edits: { qty: v.qty ? Number(v.qty) : undefined, supplier: v.supplier || undefined } })));
  reject.addEventListener("click", () => ask("Reject this recommendation", [["reason", "Reason (required)", ""]], v => v.reason ? send("REJECT", { reason: v.reason }) : toast("A reason is required.")));
  snooze.addEventListener("click", () => ask("Snooze: look at it again later", [["days", "Days", "7"]], v => send("SNOOZE", { snooze_days: Number(v.days) || 7 })));

  return h("div", { class: "stack" },
    card(`${p.generic}: recommended action`, p.awaiting_level === 2 ? "Waiting for the second approver (Procurement / Director)" : "Waiting for the Chief Pharmacist", opt[1],
      h("div", { class: "stack" },
        h("div", { class: "row" }, tag(o[0], o[1]), p.needs_second_approver ? tag("Needs a second approver", "Information", "customer") : null),
        h("p", { class: "answer" }, sentence),
        pr ? facts([["Material / plant", `${pr.Material} / ${pr.Plant}`], ["Delivery date", fmt.date(pr.DeliveryDate)], ["Purchasing group", pr.PurchasingGroup]]) : null,
        h("ui5-button", { design: "Transparent", icon: "activity-2", onclick: () => go("understand", p.form_id) }, "Why is this medicine at risk?"))),
    card("Rule checks (agent A5)", "Run automatically before anyone sees the option", AGENT.A5[2], checks),
    card("Manual verification", "Tick every item to enable Approve", "workflow-tasks",
      h("div", { class: "stack" }, h("div", { class: "checks" }, ...boxes),
        h("div", {}, h("ui5-label", { "show-colon": true }, "Approver"), h("div", {}, user)),
        h("div", { class: "row" }, approve, edit, reject, snooze), result)));
}
function outcome(r, p) {
  if (r.status === "ACTIONED") return h("div", { class: "stack" },
    strip("Positive", `Approved. Purchase requisition ${r.banfn} was created in SAP S/4HANA format (API_PURCHASEREQ_PROCESS_SRV). This is a mock posting into the hospital's requisition table, not a live S/4 system.`),
    h("ui5-panel", { "header-text": "Purchase requisition payload (S/4 OData format)", collapsed: true }, h("pre", { class: "json" }, JSON.stringify(r.payload, null, 2))),
    h("div", { class: "row" }, h("ui5-button", { design: "Emphasized", icon: "chain-link", onclick: () => go("prove", p.run_id) }, "See the audit trail")));
  if (r.status === "AWAITING_SECOND_APPROVER") return h("div", { class: "stack" },
    strip("Critical", "Approved at level 1. Because of the order value or a substitute medicine, a second person (Procurement / Director) must now approve."),
    h("ui5-button", { onclick: () => go("decide", p.rec_id) }, "Open for the second approver"));
  if (r.status === "APPROVED_NO_PR") return strip("Positive", "Approved. This is an internal stock move, so no purchase requisition is needed.");
  return strip("Information", `Recorded: ${r.status.toLowerCase().replace(/_/g, " ")}.`);
}
function ask(title, fields, onOk) {
  const dlg = document.getElementById("askDlg"); dlg.setAttribute("header-text", title);
  const inputs = fields.map(([k, label, val]) => [k, h("ui5-input", { value: val, "accessible-name": label, style: "width:100%" })]);
  document.getElementById("askBody").replaceChildren(...inputs.flatMap(([k, inp], i) => [h("ui5-label", { "show-colon": true }, fields[i][1]), inp]));
  const ok = document.getElementById("askOk"), cancel = document.getElementById("askCancel");
  const done = () => { dlg.open = false; ok.onclick = null; cancel.onclick = null; };
  ok.onclick = () => { const v = Object.fromEntries(inputs.map(([k, inp]) => [k, inp.value.trim()])); done(); onOk(v); };
  cancel.onclick = done; dlg.open = true;
}

/* ============================================================ 4. PROVE */
async function prove() {
  const runInput = h("ui5-input", { value: state.run || "", placeholder: "Run id, e.g. ff-…", "accessible-name": "Run id", style: "width: 20rem" });
  const box = h("div", {});
  const load = async () => {
    const id = runInput.value.trim(); if (!id) { box.replaceChildren(strip("Information", "Open a medicine first, or type a run id.")); return; }
    state.run = id; store.set("lastRun", id); box.replaceChildren(busy("Loading the audit trail…"));
    try { box.replaceChildren(auditView(await api(`/audit/${encodeURIComponent(id)}`))); }
    catch (e) { box.replaceChildren(strip("Negative", "Could not load the audit trail: " + e.message)); }
  };
  $app.replaceChildren(h("div", { class: "stack" },
    h("h1", { class: "page" }, "Proof: every step is recorded"),
    h("p", { class: "lead muted" }, "Each agent's input and output is fingerprinted (hashed) and chained to the previous step, like a ledger. Changing any past record breaks the chain, so tampering is visible. This is the evidence an NABH auditor can check."),
    h("div", { class: "row" }, h("ui5-label", { "show-colon": true }, "Run"), runInput, h("ui5-button", { icon: "refresh", onclick: load }, "Load")), box));
  if (runInput.value) load();
}
function auditView(a) {
  const run = a.run || {}, ok = a.chain.ok;
  const report = h("ui5-button", { icon: "document", design: "Emphasized" }, "Open the NABH evidence report");
  report.addEventListener("click", async () => {
    report.disabled = true;
    try { const html = await api(`/audit/${encodeURIComponent(a.run_id)}/report`, { raw: true });
      const url = URL.createObjectURL(new Blob([html], { type: "text/html" })); window.open(url, "_blank", "noopener"); }
    catch (e) { toast("Report unavailable: " + e.message); } finally { report.disabled = false; }
  });
  const items = a.events.map(e => {
    const ag = AGENT[e.agent] || [e.agent, "", "notes"];
    const srcs = e.data_sources || [];
    const counts = srcs.reduce((m, s) => (m[s.is_proxy] = (m[s.is_proxy] || 0) + 1, m), {});
    return h("ui5-timeline-item", { "title-text": `${e.seq + 1}. ${ag[0]} (${e.agent})`, "subtitle-text": fmt.ts(e.ts), icon: ag[2] },
      h("div", { class: "small stack" }, h("div", {}, ag[1]),
        h("div", { class: "muted" }, `fingerprint in ${fmt.hash(e.input_hash)} · out ${fmt.hash(e.output_hash)} · linked to previous ${fmt.hash(e.prev_hash)}`),
        srcs.length ? h("div", { class: "row" }, `${srcs.length} data sources:`, ...Object.entries(counts).map(([t, n]) => h("span", {}, dataTag(t), " ×" + n))) : null));
  });
  return h("div", { class: "stack" },
    h("div", { class: "grid g4" },
      kpi(ok ? "Intact" : "Broken", "Audit chain", ok ? `${a.chain.n_rows} linked records, none altered` : `broken at record ${a.chain.broken_at}: ${a.chain.reason}`, ok ? "pos" : "neg"),
      kpi(a.events.length, "Steps recorded", "agents A1–A5, the human decision and A6", ""),
      kpi(run.TRIGGER_TYPE === "SHOCK" ? "Shock" : (run.TRIGGER_TYPE || "–"), "Why it ran", run.TRIGGER_TYPE === "SHOCK" ? "stress test: import costs +30%" : "on demand or nightly", ""),
      kpi(fmt.ts(run.STARTED_AT), "Started", `status ${String(run.STATUS || "").toLowerCase().replace(/_/g, " ")}`, "")),
    h("div", { class: "row" }, report),
    card("What happened, step by step", a.run_id, "history", h("ui5-timeline", { layout: "Vertical", "accessible-name": "Audit trail" }, ...items)));
}

/* ============================================================ 5. RECALL */
async function recall() {
  const idInput = h("ui5-input", { value: store.get("alert", "NSQ-3F40E3F8B095"), "accessible-name": "CDSCO NSQ alert id", style: "width: 18rem" });
  const box = h("div", {});
  const load = async () => {
    const id = idInput.value.trim(); if (!id) return; store.set("alert", id); box.replaceChildren(busy("Searching every pharmacy location…"));
    try { box.replaceChildren(recallView(await api(`/recall/${encodeURIComponent(id)}`))); }
    catch (e) { box.replaceChildren(strip("Negative", "Could not trace the alert: " + e.message)); }
  };
  $app.replaceChildren(h("div", { class: "stack" },
    h("h1", { class: "page" }, "Recall: where is the failed batch?"),
    h("p", { class: "lead muted" }, "When CDSCO reports a batch as Not of Standard Quality, the pharmacist must find it everywhere in the hospital (SOP control CP-14). FlowForge matches the alert against batch stock in every location in one click."),
    h("div", { class: "row" }, h("ui5-label", { "show-colon": true }, "CDSCO alert"), idInput, h("ui5-button", { design: "Emphasized", icon: "locate-me", onclick: load }, "Find the batch")), box));
  load();
}
function recallView(r) {
  const a = r.alert || {}, m = r.matches || [];
  const total = m.reduce((s, x) => s + Number(x.CLABS || 0) + Number(x.CINSM || 0), 0);
  const MATCH = { "BATCH+MFR+FORM": "Strong match: batch, maker and medicine", "BATCH+MFR": "Batch and maker match", "BATCH+FORM": "Batch and medicine match", BATCH_ONLY: "Batch number only: verify" };
  return h("div", { class: "stack" },
    card(a.DRUG || r.alert_id, `Batch ${a.BATCH || "–"} · reported ${fmt.date(a.MONTH)}`, "lab",
      h("div", { class: "stack" },
        facts([["What failed", a.REASON || "–"], ["Reported by", a.SOURCE || "–"], ["Maker (as named)", a.MANUFACTURER_ID || "–"]]),
        h("div", { class: "row small" }, dataTag(a.IS_PROXY), a.SOURCE_URL ? h("ui5-link", { href: a.SOURCE_URL, target: "_blank" }, "CDSCO public NSQ list") : null))),
    m.length ? strip("Negative", `Found in ${new Set(m.map(x => x.LGORT)).size} locations: ${fmt.n(total)} units. Quarantine them and stop issuing this batch (CP-14).`)
      : strip("Positive", "This batch is not in the hospital's stock."),
    h("div", { class: "grid g4" }, ...m.map(x => h("ui5-card", {}, h("div", { class: "loc" },
      h("div", { class: "row spread" }, h("b", {}, LOCATION[x.LGORT] || x.LGORT), tag(x.LGORT, "Information")),
      h("div", { class: "big" }, `${fmt.n(x.CLABS)} units`), h("div", { class: "small muted" }, `available · expires ${fmt.date(x.VFDAT)}`),
      Number(x.CINSM) ? h("div", { class: "small" }, `${fmt.n(x.CINSM)} already in quality inspection`) : null,
      h("div", { class: "small", style: "margin-top: 0.4rem" }, MATCH[x.MATCH_LEVEL] || x.MATCH_LEVEL))))),
    h("p", { class: "hint" }, r.note));
}

/* ============================================================ start */
renderSteps();
if (state.key) {
  api("/health").then(hl => setConn(true, hl.db_backend)).catch(() => setConn(false));
  go("watch");
} else { go("watch"); }
</script>
