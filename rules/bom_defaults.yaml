# BOM assumptions for the A1 unit-cost model (plan §4.1, §5). Tag: PROXY.
# unit_cost = api_cost_per_kg x api_mg_per_unit / 1e6 / yield + conversion + packaging + freight
# All costs are INR per NPPA ceiling-price unit (1 tablet, 1 capsule, 1 vial, 1 mL ...).
# api_mg_per_unit = label strength converted to the salt/hydrate that is actually imported
# (salt factors are approximate molecular-weight ratios, marked [VERIFY]).
# Conversion / packaging / freight are team estimates by unit kind, NOT measured data: they set the
# scale of non-API cost so headroom is plausible. Change numbers here, not in code.
version: "2026-09-27"

yield:
  value: 0.95
  source: "assumption: 95% overall API-to-finished-unit yield (typical generic process, literature default) [VERIFY]"

unit_kinds:
  tablet:      {conversion_inr: 0.05, packaging_inr: 0.03, freight_inr: 0.01, source: "team estimate for a blister-packed generic tablet [VERIFY]"}
  capsule:     {conversion_inr: 0.08, packaging_inr: 0.03, freight_inr: 0.01, source: "team estimate for a blister-packed hard-gelatin capsule [VERIFY]"}
  powder_inj:  {conversion_inr: 3.00, packaging_inr: 1.50, freight_inr: 0.30, source: "team estimate for an aseptically filled dry-powder vial [VERIFY]"}
  inj_ml:      {conversion_inr: 0.40, packaging_inr: 0.25, freight_inr: 0.05, source: "team estimate per mL of a filled ampoule/vial [VERIFY]"}
  drops_ml:    {conversion_inr: 0.80, packaging_inr: 0.80, freight_inr: 0.05, source: "team estimate per mL of a sterile eye-drop bottle [VERIFY]"}
  resp_ml:     {conversion_inr: 0.30, packaging_inr: 0.20, freight_inr: 0.05, source: "team estimate per mL of respules / nebuliser solution [VERIFY]"}

# FORM_ID (data/seed/targets.csv) -> API rows. Biologicals (vaccines, immunoglobulins) have no entry:
# the cost model is not applied to them (see data/seed/api_hs8.csv).
