# Scoring constants (plan §4). Every leaf is {value, source, verify}.
# FROZEN for the finale at v1.0.0 (S12, 2026-09-27): hand-set, not tuned; see docs/backtest_results.md.
# verify: true = assumption or unconfirmed wording; confirm before the finale.
version: "1.0.0"

margin:                       # §4.1 A1 margin headroom
  retailer_margin:
    value: 0.16
    source: "DPCO 2013 para 4 basis (PTR = CP / (1 + retailer_margin))"
    verify: true
  wholesaler_margin:
    value: 0.10
    source: "Assumption, configurable (realisation = PTR / (1 + wholesaler_margin))"
    verify: true
  api_cost_median_months:
    value: 3
    source: "Plan §4.1: TradeStat unit value, 3-month moving median"
    verify: false
  trend_window_min_months:
    value: 6
    source: "Plan §4.1: OLS slope over the last 6-12 months"
    verify: false
  trend_window_max_months:
    value: 12
    source: "Plan §4.1: OLS slope over the last 6-12 months"
    verify: false

bands:                        # §4.1 signal bands
  red_headroom_pct:
    value: 0.05
    source: "Plan §4.1: headroom < 5% -> RED"
    verify: false
  red_months_to_breach:
    value: 6
    source: "Plan §4.1: months_to_breach <= 6 -> RED (aligns with DPCO para 21(2) notice)"
    verify: false
  amber_headroom_pct:
    value: 0.15
    source: "Plan §4.1: headroom < 15% -> AMBER"
    verify: false
  amber_months_to_breach:
    value: 12
    source: "Plan §4.1: months_to_breach <= 12 -> AMBER"
    verify: false

concentration:                # §4.2 conc = 0.5/n + 0.3*HHI + 0.2*top_origin_share, clamp [0,1]
  w_inv_producers:
    value: 0.5
    source: "Plan §4.2"
    verify: false
  w_hhi:
    value: 0.3
    source: "Plan §4.2"
    verify: false
  w_top_origin_share:
    value: 0.2
    source: "Plan §4.2"
    verify: false

exit_risk:                    # §4.3 sigmoid(a*(-headroom) + b/months_to_breach + c*conc + d*nsq + e*otd)
  a_neg_headroom:
    value: 8.0
    source: "Hand-set; tune once on the Para-19 backtest (§4.5), then freeze"
    verify: true
  b_inv_months_to_breach:
    value: 3.0
    source: "Hand-set; tune once on the Para-19 backtest (§4.5), then freeze"
    verify: true
  c_concentration:
    value: 2.0
    source: "Hand-set; tune once on the Para-19 backtest (§4.5), then freeze"
    verify: true
  d_nsq_recent:
    value: 1.0
    source: "Hand-set; tune once on the Para-19 backtest (§4.5), then freeze"
    verify: true
  e_otd_drop:
    value: 1.0
    source: "Hand-set; tune once on the Para-19 backtest (§4.5), then freeze"
    verify: true

  months_to_breach_floor:
    value: 1.0
    source: "Assumption: b/months_to_breach uses max(months_to_breach, floor) so a breach now stays finite"
    verify: true
  band_red:
    value: 0.7
    source: "Assumption: exit_risk >= this -> RED; tune on the Para-19 backtest (§4.5)"
    verify: true
  band_amber:
    value: 0.4
    source: "Assumption: exit_risk >= this -> AMBER; tune on the Para-19 backtest (§4.5)"
    verify: true

exposure:                     # §4.3 exposure = exit_risk * criticality * clamp((lead+requal)/max(cover,1), 0, 3)
  lead_time_days:
    value: 30
    source: "Assumption: supplier lead time for a new order (replace with EKPO-derived value when available)"
    verify: true
  requal_days:
    value: 60
    source: "Assumption: days to qualify an alternate supplier (licence, samples, rate contract)"
    verify: true
  cover_ratio_min:
    value: 0.0
    source: "Plan §4.3 clamp lower bound"
    verify: false
  cover_ratio_max:
    value: 3.0
    source: "Plan §4.3 clamp upper bound"
    verify: false
  days_of_cover_floor:
    value: 1
    source: "Plan §4.3 max(days_of_cover, 1)"
    verify: false

criticality:                  # §4.3 VED weights
  V:
    value: 1.0
    source: "Plan §4.3 VED: Vital"
    verify: false
  E:
    value: 0.6
    source: "Plan §4.3 VED: Essential"
    verify: false
  D:
    value: 0.3
    source: "Plan §4.3 VED: Desirable"
    verify: false
  nlem_core_multiplier:
    value: 1.2
    source: "Plan §4.3: x1.2 if NLEM core/primary level"
    verify: false

watchlist:                    # §4.4
  top_n:
    value: 10
    source: "Plan §4.4: show top 10, sort by exposure, tie-break by confidence"
    verify: false

secondary:                    # §3 A1 secondary signals (NSQ lookback lives in sop_controls QUALITY_HISTORY)
  otd_window_months:
    value: 3
    source: "Assumption: OTD drop = mean OTD of last N months vs the N months before"
    verify: true
  cold_chain_window_days:
    value: 90
    source: "Assumption: count cold-chain excursions in the last N days"
    verify: true

graph:                        # §3 A2/A4 correlated-risk check
  shared_origin_min_share:
    value: 0.2
    source: "Assumption: a country counts as a shared upstream origin only if it supplies >= this share of the API's imports"
    verify: true

window:                       # §3 A3 exit-risk window from months_to_breach, adjusted by concentration
  conc_shrink:
    value: 0.5
    source: "Assumption: window_lo = months_to_breach * (1 - conc_shrink * conc); window_hi = months_to_breach + DPCO para 21(2) notice"
    verify: true

forecast:                     # §3 A3 consumption forecast
  min_months_for_ets:
    value: 6
    source: "Plan S06: fewer than 6 months of history -> moving average"
    verify: false
  moving_average_days:
    value: 90
    source: "Plan S06: 90-day moving average fallback"
    verify: false
  max_days_of_cover:
    value: 3650
    source: "Cap when forecast consumption is zero (keeps the number finite)"
    verify: false

resilience:                   # §3 A4 option sizing (CP-SAT)
  stockout_penalty_multiplier:
    value: 20
    source: "Assumption: unmet unit costs this many times the ceiling price in the objective"
    verify: true
  expiry_margin_days:
    value: 30
    source: "Assumption: safety margin before expiry (qty <= daily x (shelf life - margin) - usable stock)"
    verify: true
  default_moq_units:
    value: 100
    source: "Placeholder MOQ when no supplier offer is on record"
    verify: true
  alt_price_premium:
    value: 0.10
    source: "Assumption: alternate supplier price = current net rate x (1 + premium) when it has no PO history"
    verify: true
  offered_shelf_life_months:
    value: 24
    source: "Assumption: residual shelf life on delivery when no offer is on record"
    verify: true
  rebalance_handling_inr_per_unit:
    value: 0.05
    source: "Assumption: internal transfer handling cost per unit"
    verify: true
  default_horizon_days:
    value: 90
    source: "Assumption: cover horizon when A3 gives no exit window"
    verify: true
  max_horizon_days:
    value: 365
    source: "Assumption: cap on the cover horizon (don't stockpile for years)"
    verify: true
  correlated_risk_action:
    value: "reject"
    source: "Plan §3 A4: reject or penalise an alternate that shares API origin/KSM; 'reject' or 'penalise'"
    verify: true
  correlated_risk_penalty:
    value: 0.25
    source: "Assumption: objective uplift for a correlated alternate when action = penalise"
    verify: true
